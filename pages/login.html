<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="view-transition" content="same-origin">
  <title>Đăng nhập admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Inter"', 'sans-serif'] } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="font-sans text-slate-200 min-h-screen flex items-center justify-center p-4">

  <div class="glass-panel rounded-3xl w-full max-w-md p-6 sm:p-8 space-y-5 border border-white/20">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
      <h1 class="text-xl font-bold text-white">Đăng nhập admin</h1>
      <a href="../index.html" class="p-2 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </a>
    </div>

    <form id="loginForm" class="space-y-4">
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-400">Email</label>
        <input type="email" id="email" required placeholder="admin@example.com"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all shadow-inner" />
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-400">Mật khẩu</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all shadow-inner" />
      </div>
      <button type="submit" id="submitBtn"
        class="spring-btn w-full py-2.5 rounded-xl bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 border border-cyan-500/30 font-semibold transition-all flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Đăng nhập</span>
      </button>
    </form>

    <p id="loginToast" class="text-sm text-center text-slate-400 min-h-[20px]"></p>
  </div>

  <script>if (window.lucide) lucide.createIcons();</script>
  <script type="module" src="../assets/js/login.js"></script>
</body>

</html>
