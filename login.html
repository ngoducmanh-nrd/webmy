<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập quản trị - Ngô Đức Mạnh Portfolio</title>
  <meta name="description" content="Login page for admin editing portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- supabaseConfig.js imported in script.js as ES module -->
  <script type="module" src="script.js" defer></script>
  <style>
    body {font-family: 'Inter', sans-serif;}
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">
  <!-- Login Modal (visible) -->
  <div id="loginModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md transition-all duration-[400ms]">
    <div class="glass-panel rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 sm:p-8 space-y-6 shadow-[0_0_50px_rgba(0,0,0,0.8)] relative border border-white/20">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h3 class="text-xl font-bold text-white">Đăng nhập quản trị</h3>
        <button id="closeLoginBtn" class="p-2 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="loginForm" class="space-y-4">
        <input id="loginEmail" type="email" placeholder="Email admin" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" />
        <button type="submit" class="spring-btn w-full py-2.5 rounded-xl bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 border border-cyan-500/30">Gửi Magic Link</button>
      </form>
    </div>
  </div>
</body>
</html>
