<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="view-transition" content="same-origin">
  <title>Ghi chú cá nhân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Inter"', 'sans-serif'] } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body
  class="font-sans min-h-screen relative overflow-x-hidden text-slate-200 selection:bg-cyan-900 selection:text-cyan-100">

  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="bg-overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/40 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 rounded-xl hover:bg-white/10 text-slate-300 hover:text-white transition-colors"
          title="Về portfolio">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="sticky-note" class="w-5 h-5 text-amber-400"></i>
            Ghi chú
          </h1>
          <p class="text-[11px] text-slate-500">Note nhanh · Code snippet · Link</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="logoutBtn"
          class="hidden px-4 py-2 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/30 text-sm font-medium transition-colors">
          Đăng xuất
        </button>
        <a id="loginLink" href="login.html"
          class="hidden px-4 py-2 rounded-xl bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 border border-cyan-500/30 text-sm font-medium transition-colors">
          Đăng nhập
        </a>
      </div>
    </div>
  </header>

  <!-- Auth gate -->
  <div id="authGate" class="hidden max-w-md mx-auto mt-32 p-8 glass-panel rounded-3xl text-center space-y-4">
    <i data-lucide="lock" class="w-12 h-12 mx-auto text-slate-500"></i>
    <h2 class="text-xl font-bold text-white">Trang này riêng tư</h2>
    <p class="text-sm text-slate-400">Cần đăng nhập admin để xem ghi chú.</p>
    <a href="login.html"
      class="inline-block px-6 py-2.5 rounded-xl bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 border border-cyan-500/30 text-sm font-semibold transition-colors">
      Đăng nhập
    </a>
  </div>

  <!-- App -->
  <main id="app" class="hidden max-w-6xl mx-auto px-4 py-6 space-y-5">

    <!-- Quick add -->
    <div class="glass-panel rounded-2xl p-4 flex items-start gap-3">
      <input id="quickInput" type="text" placeholder="Ghi nhanh gì đó... (Enter để lưu)"
        class="flex-1 bg-transparent text-white placeholder-slate-500 focus:outline-none text-sm py-2" />
      <button id="quickAddBtn"
        class="px-4 py-2 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 text-sm font-semibold transition-colors shrink-0">
        Lưu
      </button>
      <button id="openFullBtn" title="Thêm chi tiết (màu, tag...)"
        class="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white border border-white/10 transition-colors shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Search + filter -->
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <i data-lucide="search"
          class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"></i>
        <input id="searchInput" type="text" placeholder="Tìm trong ghi chú..."
          class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:outline-none text-sm" />
      </div>
      <select id="tagFilter"
        class="px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:outline-none text-sm">
        <option value="">Tất cả tag</option>
      </select>
    </div>

    <!-- Notes grid -->
    <div id="notesGrid" class="columns-1 sm:columns-2 lg:columns-3 gap-4 [column-fill:_balance]"></div>

    <div id="emptyState" class="hidden text-center py-16 glass-card rounded-3xl border-dashed border-white/20">
      <i data-lucide="sticky-note" class="w-10 h-10 mx-auto mb-3 opacity-40"></i>
      <p class="text-sm text-slate-500">Chưa có ghi chú nào. Gõ gì đó ở ô trên đi!</p>
    </div>
  </main>

  <!-- Selection Action Bar -->
  <div id="selectionBar"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] px-4 py-3 rounded-2xl bg-slate-800/95 border border-white/20 backdrop-blur-xl shadow-2xl items-center gap-4 transition-all duration-300">
    <span class="text-sm text-white whitespace-nowrap">
      Đã chọn <b id="selCount" class="text-cyan-400">0</b>
    </span>
    <div class="w-px h-5 bg-white/20"></div>
    <button id="deleteSelectedBtn"
      class="spring-btn px-4 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-semibold transition-colors flex items-center gap-1.5">
      <i data-lucide="trash-2" class="w-4 h-4"></i>
      <span>Xóa</span>
    </button>
    <button id="clearSelectionBtn"
      class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 text-sm transition-colors">
      Bỏ chọn
    </button>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
    <div id="modalContent"
      class="glass-panel rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 space-y-5 border border-white/20 transition-transform duration-300 scale-95">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-white">Sửa ghi chú</h3>
        <button id="closeModalBtn"
          class="p-2 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="noteForm" class="space-y-4 text-sm">
        <input type="hidden" id="editId" />

        <input id="fTitle" type="text" placeholder="Tiêu đề (tùy chọn)"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:outline-none" />

        <textarea id="fContent" rows="6" required placeholder="Nội dung..."
          class="w-full px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:outline-none resize-none font-mono text-sm"></textarea>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-400">Tags (phẩy phân cách)</label>
            <input id="fTags" type="text" placeholder="work, code, idea"
              class="w-full px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 text-white focus:border-cyan-500 focus:outline-none text-sm" />
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-400">Ghim lên đầu</label>
            <label
              class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900/50 border border-white/10 cursor-pointer">
              <input id="fPinned" type="checkbox" class="accent-cyan-500" />
              <span class="text-sm text-slate-300">Ghim ghi chú này</span>
            </label>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-400">Màu</label>
          <div id="colorPicker" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-white/10">
          <div class="flex gap-2">
            <button type="button" id="deleteBtn" class="hidden text-xs text-red-400 hover:underline">Xóa</button>
            <button type="button" id="copyBtn" class="hidden text-xs text-cyan-400 hover:underline">Copy nội
              dung</button>
          </div>
          <div class="flex gap-2 ml-auto">
            <button type="button" id="cancelBtn"
              class="px-4 py-2 rounded-xl border border-white/20 text-slate-300 hover:bg-white/5 text-sm">Hủy</button>
            <button type="submit"
              class="px-5 py-2 rounded-xl bg-gradient-to-r from-cyan-600 to-purple-600 text-white font-semibold text-sm shadow-lg shadow-cyan-900/40">Lưu</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"
    class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[110] flex items-center gap-3 px-5 py-3 rounded-2xl bg-slate-800/90 border border-white/10 text-white text-sm font-medium translate-y-20 opacity-0 pointer-events-none transition-all duration-300 shadow-2xl backdrop-blur-xl">
    <div class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center">
      <i data-lucide="check" class="w-3.5 h-3.5"></i>
    </div>
    <span id="toastMsg">OK</span>
  </div>

  <script>if (window.lucide) lucide.createIcons();</script>
  <script type="module" src="notes.js"></script>
</body>

</html>
